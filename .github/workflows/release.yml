name: release

on:
  push:
    tags:
      - "v*"
  # Lets you verify the build without cutting a tag; produces a downloadable
  # artifact but no release.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  WASM_PATH: target/wasm32-wasip1/release/zellij-nolock.wasm

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Cache cargo registry and target dir
        uses: Swatinem/rust-cache@v2

      - name: Verify tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          echo "tag=$tag manifest=$manifest"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${manifest}"
            exit 1
          fi

      - name: Build
        run: cargo build --release --locked

      - name: Package artifact
        id: package
        run: |
          bin="zellij-nolock-${GITHUB_REF_NAME}.wasm"
          cp "$WASM_PATH" "$bin"
          sha256sum "$bin" | tee "${bin}.sha256"
          echo "bin=$bin" >> "$GITHUB_OUTPUT"
          {
            echo "### zellij-nolock ${GITHUB_REF_NAME}"
            echo ""
            echo '```'
            cat "${bin}.sha256"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: zellij-nolock-${{ github.ref_name }}
          path: |
            ${{ steps.package.outputs.bin }}
            ${{ steps.package.outputs.bin }}.sha256
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          BIN: ${{ steps.package.outputs.bin }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$BIN" "$BIN.sha256" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$BIN" "$BIN.sha256" \
              --title "zellij-nolock ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
